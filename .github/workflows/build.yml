name: build

on: [push, pull_request]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: make test
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2
    steps:
      - uses: actions/checkout@v4
      - name: build firmware (classic ESP32 target)
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          idf.py set-target esp32
          idf.py build
